name: Safe editorial cleanup

on:
  push:
    branches:
      - agent/editorial-humanization-safe

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/editorial-humanization-safe
          fetch-depth: 0

      - name: Apply safe editorial corrections
        run: |
          python3 -m py_compile tools/editorial_cleanup.py
          python3 tools/editorial_cleanup.py --apply

      - name: Commit corrections
        run: |
          if git diff --quiet; then
            echo "No editorial changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md _config.yml _data _layouts _posts *.html 2>/dev/null || true
          git commit -m "Apply safe editorial normalization [skip ci]"
          git push origin HEAD:agent/editorial-humanization-safe
