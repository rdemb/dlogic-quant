name: Validate Jekyll site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  id-token: write

concurrency:
  group: "site-validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate editorial style
        run: |
          python3 -m py_compile tools/editorial_cleanup.py tools/rendered_html_audit.py
          python3 tools/editorial_cleanup.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate rendered HTML
        run: python3 tools/rendered_html_audit.py _site
