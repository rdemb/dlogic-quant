name: Validate Jekyll site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  id-token: write

concurrency:
  group: "site-validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public source content
        run: |
          python3 -m py_compile \
            .github/scripts/validate_editorial.py \
            .github/scripts/validate_rendered_site.py
          python3 .github/scripts/validate_editorial.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate published artifact
        run: |
          python3 .github/scripts/validate_rendered_site.py \
            _site \
            --baseurl /dlogic-quant
