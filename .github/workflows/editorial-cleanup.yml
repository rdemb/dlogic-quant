name: Editorial cleanup

on:
  push:
    branches:
      - agent/editorial-humanization-pass

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/editorial-humanization-pass
          fetch-depth: 0

      - name: Normalize public prose and print audit
        run: python3 tools/editorial_cleanup.py --apply

      - name: Commit normalized typography
        run: |
          if git diff --quiet; then
            echo "No mechanical typography changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md _config.yml _data _layouts _posts *.html 2>/dev/null || true
          git commit -m "Normalize public typography [skip ci]"
          git push origin HEAD:agent/editorial-humanization-pass
