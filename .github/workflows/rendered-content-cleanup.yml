name: Rendered content cleanup

on:
  push:
    branches:
      - agent/editorial-rendered-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/editorial-rendered-cleanup
          fetch-depth: 0

      - name: Replace prose that renders as Unicode ellipsis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('_posts/2026-08-11-grawitacja-nie-jest-sila-ale-to-zdanie-tez-oszukuje.md'): [
                  (
                      'Jest jednak modelem, który wyjaśnia grawitację za pomocą... ziemskiej grawitacji.',
                      'Jest jednak modelem, który wyjaśnia grawitację za pomocą ziemskiej grawitacji.'
                  ),
              ],
              Path('_posts/2026-07-06-capm-i-faktory-skad-zwrot.md'): [
                  (
                      'Harvey, Liu i Zhu w "... and the Cross-Section of Expected Returns" (2016)',
                      'Harvey, Liu i Zhu w artykule z 2016 roku o przekroju oczekiwanych stóp zwrotu'
                  ),
              ],
              Path('_posts/2026-07-05-data-snooping-jak-finanse-sie-oszukuja.md'): [
                  (
                      'Harvey, Liu i Zhu w pracy „...and the Cross-Section of Expected Returns" (Review of Financial Studies, 2016)',
                      'Harvey, Liu i Zhu w artykule z 2016 roku opublikowanym w Review of Financial Studies'
                  ),
              ],
              Path('_posts/2026-07-11-dane-rynkowe-tick-bar-ohlc.md'): [
                  (
                      'Gotowym skrótem na to samo jest metoda resample(...).ohlc(), która',
                      'Gotowym skrótem na to samo jest metoda `resample(...).ohlc()`, która'
                  ),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected source text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('CHANGED_FILES', len(changed))
          for path in changed:
              print(path)
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          git commit -m "Remove rendered ellipsis from public prose [skip ci]"
          git push origin HEAD:agent/editorial-rendered-cleanup
